# Docker Compose — local development.
#
# Modular monolith architecture: Next.js frontend + API Route Handlers
# backed directly by PostgreSQL database. The Django backend runtime
# has been decommissioned.

services:
  frontend:
    build:
      context: ./root-NGWH
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./root-NGWH:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
      - backend_media:/app/media
    env_file:
      - ./root-NGWH/.env.example
    environment:
      - NODE_ENV=development
      - MEDIA_ROOT=/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-nextgen_women_hoops}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      # Named, persistent volume — never anonymous/ephemeral (ARCHITECTURE.md §9).
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  frontend_node_modules:
  frontend_next_cache:
  postgres_data:
  backend_media:

